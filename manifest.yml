---
name: RStudio Server (CIRRUS)
category: Interactive Apps
subcategory: Servers
role: batch_connect
description: |
  This app launches an [RStudio Server] session on the Cirrus Kubernetes
  cluster, with your home directory and GLADE storage mounted.

  R packages you install go to `~/rstudio/r-libs/`, separate from the library
  your Casper and Derecho sessions use: packages built in this container do
  not load on those systems.

  [RStudio Server]: https://posit.co/products/open-source/rstudio-server/
