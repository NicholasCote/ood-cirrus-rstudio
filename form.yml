---
cluster: "cirrus"

form:
  - working_dir
  - cpu
  - memory

attributes:
  working_dir:
    widget: text_field
    label: "Working directory"
    value: ""
    required: false
    help: |
      Absolute path RStudio opens in the Files pane and starts the console in.
      Leave blank for your home directory. Your home, /glade/work,
      /glade/campaign (read-only), /glade/collections and /gdex are mounted,
      so it should be a path under one of those.

      Sessions end after **1 hour with no activity** and after **12 hours** in
      any case. Your files, installed R packages and RStudio settings are kept.

  cpu:
    widget: number_field
    label: "CPUs"
    min: 1
    max: 8
    value: 2
    step: 1
    required: true

  memory:
    widget: number_field
    label: "Memory (GB)"
    min: 1
    max: 32
    value: 8
    step: 1
    required: true
