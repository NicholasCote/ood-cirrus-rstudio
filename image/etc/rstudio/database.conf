# The base image ships this file mode 0600 owned by rstudio-server, which the
# session's arbitrary uid cannot read, and its default sqlite directory
# (/var/lib/rstudio-server) which the session cannot write. Both are fatal
# before the port is ever bound.
#
# This is per-session state with no value past the pod, so /tmp is the correct
# home for it -- not the user's GLADE home, which is shared with Casper and
# Derecho. The entrypoint creates the directory.
provider=sqlite
directory=/tmp/cirrus-rstudio/database
