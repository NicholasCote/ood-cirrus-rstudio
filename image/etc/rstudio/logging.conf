# Log to stderr, not syslog.
#
# The base image ships logger-type=syslog. There is no syslog daemon in a
# container, so every message rserver and rsession emit is discarded -- and the
# one that matters most is emitted before the server has bound anything:
#
#   ERROR Attempt to run server as user 'rstudio-server' (uid 997) from account
#   '54321' (uid 54321) without privilege
#
# With syslog logging that arrives nowhere and `kubectl logs` shows an empty
# pod that exited 1. On stderr it lands in the pod log, which is the only place
# anyone can read it from.
#
# log-level=info rather than warn: the extra lines are a handful per startup and
# they name the resolved server user, the database path, and which secure key
# was used, all of which are the first questions asked when a session misbehaves.
[*]
log-level=info
logger-type=stderr
