# Settings that are the same for every session. Per-session ones (port,
# server user, data directory) are flags in the entrypoint.

rsession-which-r=/usr/local/bin/R

# No auth-pam-helper-path: running as the user rather than root, rserver never
# calls one. The password is checked by cirrus-rstudio-gate instead.

# Never show RStudio's own sign-in form mid-session; the user never saw a
# password to type into it. Idle sessions are ended by the entrypoint instead.
auth-timeout-minutes=0
auth-stay-signed-in-days=1
