# Settings that are the same for every session in this image.
#
# Anything that varies per session -- port, proxy root path, server user, data
# directory, secure cookie key -- is a flag in the entrypoint instead, because
# it is not known until the pod is running.

# The base image's own setting, preserved: without it rserver searches PATH.
rsession-which-r=/usr/local/bin/R

# Deliberately NOT set here: auth-pam-helper-path and auth-encrypt-password.
#
# They would be dead settings. Running without privilege -- which this session
# always is, because the pod runs as the user's real NFS uid -- rserver signs
# the caller in as the server user on request and never consults a helper at
# all. Verified with a helper configured and every auth option at its default:
#
#   $ curl -c jar '.../auth-sign-in?appUri=%2F'
#   HTTP/1.1 302 Moved Temporarily
#   Set-Cookie: user-id=ncote|...
#
# with no password sent and no line from the helper anywhere in the log. The
# per-session password is enforced by /usr/local/bin/cirrus-rstudio-gate, which
# holds the public port and forwards to this server on loopback. Configuring a
# helper here as well would only suggest a check that is not happening.

# Never sign the user out mid-session.
#
# The default is 60 minutes of idle, after which RStudio shows its own login
# form -- inside the OnDemand session, asking for a password the user has never
# seen, because the Connect button posted it for them. There is no path forward
# from that screen except going back to the dashboard and clicking Connect
# again, which is a confusing thing to hand someone.
#
# Idle sessions are reclaimed by the watchdog in the entrypoint instead, which
# ends the pod and releases its CPU and memory rather than leaving it running
# behind a login form.
#
# 0 disables the timeout and enables the legacy "stay signed in" path, which is
# why the days below matter: they cap how long the cookie is good for, and the
# pod's own 12h lifetime is well inside it.
auth-timeout-minutes=0
auth-stay-signed-in-days=1
