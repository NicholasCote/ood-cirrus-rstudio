name: Build and push RStudio Server image

on:
  workflow_dispatch:
    inputs:
      skip_bump:
        description: "Build and push, but do not pin the new tag in submit.yml.erb"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - image/**
      - .github/workflows/build.yml
    branches:
      - main

# Two builds racing would each pin their own tag; run them one at a time.
concurrency:
  group: build-rstudio-image
  cancel-in-progress: false

permissions:
  contents: write   # to commit the new tag back to submit.yml.erb

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          # Full history, so the pin commit can be rebased if main moved.
          fetch-depth: 0

      # The one place the reference is assembled; build, push, pin and
      # summary all read it.
      - name: Compose the image reference
        id: ref
        run: |
          tag="$(date +'%Y-%m-%d.%H.%M')"
          {
            echo "tag=${tag}"
            echo "image=hub.k8s.ucar.edu/ncote/rstudio-server:${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: registry login
        uses: docker/login-action@v3
        with:
          registry: hub.k8s.ucar.edu
          username: ${{ secrets.HARBOR_LOGIN }}
          password: ${{ secrets.HARBOR_SECRET }}

      - name: Build image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          docker buildx build \
            -t "$IMAGE" \
            -f image/Dockerfile \
            image

      # Runs as an arbitrary uid, the way OnDemand runs the pod, and fails the
      # build before anything is pushed.
      - name: Smoke test
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm --user 54321:54321 -e HOME=/tmp/h -e USER=jdoe \
            --entrypoint /usr/local/bin/entrypoint.sh "$IMAGE" bootstrap bash -c '
              set -euo pipefail
              for b in rserver R ssh ssh-agent ssh-add jq curl git bao-getkey cirrus-rstudio-gate; do
                command -v "$b" >/dev/null || [ -x /usr/lib/rstudio-server/bin/$b ] \
                  || { echo "MISSING: $b"; exit 1; }
              done
              echo "9fee1714bd7b149dec56798304350642167cae3eb9236aecfbc44fd39dc7bf9e  /usr/local/bin/bao-getkey" \
                | sha256sum -c --quiet
              [ "$(id -un)" = jdoe ] || { echo "uid has no user name"; exit 1; }
              # The per-session agent the entrypoint starts for bao-getkey.
              eval "$(ssh-agent -a /tmp/agent.sock)" >/dev/null
              set +e; ssh-add -l >/dev/null 2>&1; rc=$?; set -e
              [ "$rc" = 1 ] || { echo "ssh-agent unreachable (ssh-add -l exit $rc)"; exit 1; }
              echo "smoke test OK"
            '
          # A real session: the gate must come up and serve its login page.
          mkdir -p ood && printf 'password=smoke\n' > ood/csenv && chmod -R a+rX ood
          docker run -d --name smoke --user 54321:54321 -p 18080:8080 \
            -v "$PWD/ood:/ood:ro" -e HOME=/tmp/h -e USER=jdoe \
            -e CIRRUS_RSTUDIO_PASSWORD_FILE=/ood/csenv "$IMAGE" rserver
          for _ in $(seq 1 60); do
            curl -fs -o /dev/null http://127.0.0.1:18080/ && break
            sleep 1
          done
          curl -fs http://127.0.0.1:18080/ | grep -q 'Session password' \
            || { docker logs smoke; exit 1; }
          docker exec smoke bash -c 'SSH_AUTH_SOCK=/tmp/cirrus-rstudio/ssh-agent.sock ssh-add -l; [ $? = 1 ]' \
            || { docker logs smoke; exit 1; }
          docker stop -t 20 smoke >/dev/null
          rc="$(docker inspect smoke --format '{{.State.ExitCode}}')"
          docker rm smoke >/dev/null
          [ "$rc" = 0 ] || { echo "SIGTERM gave exit $rc, expected 0"; exit 1; }
          echo "session smoke test OK"

      - name: Push image to Harbor
        id: push
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: docker push "$IMAGE"

      # Only after a smoke-tested push, and only from main: a manual run on
      # another branch must never repin what users get. The commit touches
      # only submit.yml.erb, which is outside the paths that trigger this
      # workflow, so it cannot start another build.
      - name: Pin the new tag in submit.yml.erb
        id: pin
        if: ${{ github.ref == 'refs/heads/main' && !inputs.skip_bump }}
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          python3 - "$IMAGE" <<'PY'
          import pathlib, re, sys
          ref = sys.argv[1]
          p = pathlib.Path("submit.yml.erb")
          new, n = re.subn(r'^(\s*rstudio_img\s*=\s*)".*"$',
                           lambda m: f'{m.group(1)}"{ref}"', p.read_text(), count=1, flags=re.M)
          if n != 1:
              sys.exit("could not find a single rstudio_img assignment in submit.yml.erb")
          p.write_text(new)
          PY
          if git diff --quiet -- submit.yml.erb; then
            echo "rstudio_img already at ${IMAGE}; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submit.yml.erb
          git commit -m "Pin rstudio_img to ${IMAGE##*:} [skip ci]"
          # main may have moved during the build; replay the one-line change.
          for _ in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Pushed ${IMAGE} but could not commit the pin to main."
          exit 1

      - name: Summarise the pushed image
        if: ${{ always() && steps.push.outcome == 'success' }}
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
          PIN_OUTCOME: ${{ steps.pin.outcome }}
        run: |
          echo "::notice title=Image pushed::${IMAGE}"

          # Read back from the built image; never worth failing the run over.
          digest="$(docker image inspect \
              --format '{{ if .RepoDigests }}{{ index .RepoDigests 0 }}{{ end }}' \
              "$IMAGE" 2>/dev/null || true)"
          versions="$(docker run --rm --entrypoint cat "$IMAGE" \
              /opt/cirrus-rstudio/versions.txt 2>/dev/null || true)"

          {
            echo "## Image pushed"
            echo
            echo '```'
            echo "${IMAGE}"
            echo '```'
            echo
            case "${PIN_OUTCOME}" in
              success) echo "Pinned in \`submit.yml.erb\` on \`main\`; new sessions use it once OnDemand has the update." ;;
              skipped) echo "Not pinned (manual run with skip_bump, or not on main). To use it, set in \`submit.yml.erb\`:"
                       echo; echo '```ruby'; echo "  rstudio_img = \"${IMAGE}\""; echo '```' ;;
              *)       echo "**Pinning failed** (${PIN_OUTCOME:-not run}); \`submit.yml.erb\` still has the previous image." ;;
            esac
            if [ -n "$digest" ]; then
              echo
              echo "Digest: \`${digest#*@}\`"
            fi
            if [ -n "$versions" ]; then
              echo
              echo "| component | version |"
              echo "| --- | --- |"
              printf '%s\n' "$versions" \
                | grep -v '^#' \
                | awk -F'\t' 'NF >= 2 { printf "| %s | `%s` |\n", $1, $2 }'
            fi
            echo
            echo "Tag \`${TAG}\` · commit \`${GITHUB_SHA:0:7}\` · built from \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
